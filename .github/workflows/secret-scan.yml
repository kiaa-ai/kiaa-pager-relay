name: secret-scan

# Politica de zero-segredo do KIAA. A implementacao e unica e vive em
# kiaa-ai/kiaa-workstation; aqui so se declara quando rodar.
# Relay HTTP publico — atencao redobrada a segredo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "10 7 * * 1"   # segunda-feira, escalonado na organizacao
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    uses: kiaa-ai/kiaa-workstation/.github/workflows/secret-scan-reusable.yml@main
