name: secret-scan

# Politica de zero-segredo do KIAA — versao AUTOCONTIDA.
#
# Este repositorio e publico, e repositorio publico nao pode chamar workflow
# reutilizavel hospedado em repositorio privado. Por isso a implementacao esta
# aqui inteira, em vez do 'uses:' que os repositorios privados usam.
#
# Ao alterar o reutilizavel em kiaa-ai/kiaa-workstation, replique aqui.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "10 7 * * 1"   # segunda-feira, escalonado na organizacao
  workflow_dispatch:

permissions:
  contents: read

jobs:
#     gitleaks:
#       uses: kiaa-ai/kiaa-workstation/.github/workflows/secret-scan-reusable.yml@main
#
# Usa o binario oficial do gitleaks, invocado direto no step. A Action de
# terceiro que era usada antes passou a exigir licenca para repositorio de
# organizacao e falhava antes de varrer qualquer coisa.

on:
  workflow_call:
    inputs:
      gitleaks_version:
        description: "Versao do binario gitleaks. Atualizar aqui cobre a organizacao inteira."
        type: string
        required: false
        default: "8.30.1"
      fetch_depth:
        description: "Profundidade do checkout. 0 = historico completo (padrao, e o que pega segredo antigo)."
        type: number
        required: false
        default: 0
      config_path:
        description: "Caminho de um .gitleaks.toml do repositorio chamador. Vazio = regras padrao."
        type: string
        required: false
        default: ""
      artifact_retention_days:
        description: "Retencao do relatorio SARIF."
        type: number
        required: false
        default: 30

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (zero-secret policy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (binario oficial, sem licenca)
        env:
          VERSAO: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}"
          # --retry: falha transitoria de rede nao pode reprovar o portao de
          # seguranca. Vermelho por rede e indistinguivel de vermelho por segredo.
          RETRY="--retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 15"
          escolhido=""
          for asset in "gitleaks_${VERSAO}_linux_x64.tar.gz" "gitleaks_${VERSAO}_linux_amd64.tar.gz"; do
            if curl -sSfL ${RETRY} "${base}/${asset}" -o /tmp/gitleaks.tar.gz; then
              escolhido="${asset}"
              echo "baixado: ${asset}"
              break
            fi
          done
          if [ -z "${escolhido}" ]; then
            echo "::error::nao foi possivel baixar o gitleaks ${VERSAO} apos as tentativas"
            exit 1
          fi
          test -s /tmp/gitleaks.tar.gz

          # Confere o binario contra as somas publicadas no release.
          curl -sSfL ${RETRY} "${base}/gitleaks_${VERSAO}_checksums.txt" -o /tmp/sums.txt
          esperado="$(awk -v a="${escolhido}" '$2==a || $2=="*"a {print $1}' /tmp/sums.txt | head -n1)"
          obtido="$(sha256sum /tmp/gitleaks.tar.gz | cut -d' ' -f1)"
          if [ -z "${esperado}" ]; then
            echo "::error::checksum de ${escolhido} ausente no arquivo de somas"
            exit 1
          fi
          if [ "${esperado}" != "${obtido}" ]; then
            echo "::error::checksum divergente para ${escolhido}"
            exit 1
          fi
          echo "checksum conferido"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Varrer o historico
        env:
          CONFIG: 
        run: |
          set -euo pipefail
          # --redact: o relatorio publicado nao carrega o valor do segredo.
          #   Artefato com segredo em claro seria, ele mesmo, um vazamento.
          # --exit-code 1: achado reprova o job.
          extra=""
          if [ -n "${CONFIG}" ]; then
            echo "usando config do repositorio: ${CONFIG}"
            extra="--config ${CONFIG}"
          fi
          gitleaks git . \
            --redact \
            --no-banner \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            ${extra}

      - name: Publicar relatorio (valores redigidos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30
